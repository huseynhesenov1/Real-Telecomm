<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RR Telecom - ÖDƏNİŞ</title>
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
     
    </style>
  </head>
  <body>
    <header class="navbar" id="navbar">
      <div class="container">
        <div class="nav-inner">
          <div class="logo" aria-label="RR Telecom">
            <div class="logo-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M7.4 15.3c2.2 2.2 7 1 9.9-1.9S21.4 5.7 19.2 3.5 12.2 2.5 9.3 5.4 5.2 13.1 7.4 15.3Z"
                  stroke="rgba(255,255,255,.9)"
                  stroke-width="1.6"
                />
                <path
                  d="M8 16c-2.8 2.8-6.1 3.5-7.2 2.4-1.1-1.1-.4-4.4 2.4-7.2"
                  stroke="rgba(255,255,255,.9)"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="logo-text">
              <strong>RR Telecom</strong>
              <span>Ödəniş bölməsi</span>
            </div>
          </div>

          <nav class="menu" id="menu">
            <a href="#" class="active">ANA SƏHİFƏ</a>
            <a href="#">HAQQIMIZDA</a>
            <a href="#">XİDMƏTLƏR</a>
            <a href="#" aria-current="page">ÖDƏNİŞ</a>
            <a href="#">ƏLAQƏ</a>
            <div class="contact mobile" style="display: none">
              <i class="fas fa-phone"></i>
              <a href="tel:+994123100909">+994 12 310 09 09</a>
            </div>
          </nav>

          <div class="contact desktop">
            <i class="fas fa-phone"></i>
            <a href="tel:+994123100909">+994 12 310 09 09</a>
          </div>

          <div class="hamburger" id="hamburger-menu" aria-label="Menu aç">
            <span></span><span></span><span></span>
          </div>
          <div class="close-menu" id="close-menu" aria-label="Menu bağla">&times;</div>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div class="container">
          <div class="hero-card">
            <div class="hero-inner">
              <h2 style="color: black;">Ödəniş</h2>
              <p style="color: black;">
                Aylıq ödənişləri onlayn və ya ödəniş terminalları üzərindən yerinə yetirə bilərsiniz.
              </p>

              <div class="tabs" role="tablist" aria-label="Ödəniş seçimləri">
                <button class="tab-btn active" id="onlineBtn" role="tab" aria-selected="true" style="color: black;">
                  Onlayn ödəniş
                </button>
                <button  class="tab-btn" id="terminalBtn" role="tab" aria-selected="false" style="color: black;">
                  Ödəniş terminalları
                </button>
              </div>
            </div>
          </div>

          <div class="grid" id="cardWrapper" aria-live="polite"></div>
        </div>
      </section>

      <footer class="main-footer">
        <div class="container">
          <div class="footer-line">
            <span class="line"></span>
            <span class="diamond"></span>
            <span>© 2025 RR Telecom MMC</span>
            <span class="diamond"></span>
            <span class="line"></span>
          </div>
        </div>
      </footer>
    </main>

    <script>
      const cardWrapper = document.getElementById("cardWrapper");
      const onlineBtn = document.getElementById("onlineBtn");
      const terminalBtn = document.getElementById("terminalBtn");

      // Test üçün "random" şəkillər: picsum + seed
      // Test üçün "random" linklər: hər karta ayrı yönləndirmə
      const onlineCards = [
        { name: "Fpay", tag: "Rəsmi ödəniş", seed: "fpay", link: "https://example.com/fpay" },
        { name: "Hesab.az", tag: "Sürətli", seed: "hesabaz", link: "https://example.com/hesabaz" },
        { name: "EPUL", tag: "Populyar", seed: "epul", link: "https://example.com/epul" },
        { name: "Mpay", tag: "Mobil", seed: "mpay", link: "https://example.com/mpay" },
        { name: "Milliön", tag: "Geniş şəbəkə", seed: "million", link: "https://example.com/million" },
        { name: "Birbank", tag: "Bank tətbiqi", seed: "birbank", link: "https://example.com/birbank" }
      ];

      const terminalCards = [
        { name: "Emanat", tag: "Terminal", seed: "emanat", link: "https://example.com/emanat" },
        { name: "Milliön", tag: "Terminal", seed: "million-t", link: "https://example.com/million-terminal" },
        { name: "Kassam", tag: "Terminal", seed: "kassam", link: "https://example.com/kassam" },
        { name: "Expresspay", tag: "Terminal", seed: "expresspay", link: "https://example.com/expresspay" }
      ];

      function badgeIcon(text) {
        const t = (text || "").toLowerCase();
        if (t.includes("terminal")) return "fa-solid fa-store";
        if (t.includes("mobil")) return "fa-solid fa-mobile-screen";
        if (t.includes("bank")) return "fa-solid fa-building-columns";
        if (t.includes("sürətli")) return "fa-solid fa-bolt";
        return "fa-solid fa-credit-card";
      }

      function imgUrl(seed) {
        // 640x400: sabit ölçü, seed: eyni kartda eyni şəkil
        return `https://picsum.photos/seed/${encodeURIComponent(seed)}/640/400`;
      }

      function renderCards(cards) {
        cardWrapper.innerHTML = "";

        cards.forEach((card) => {
          const col = document.createElement("div");
          col.className = "col";

          const icon = badgeIcon(card.tag);

          col.innerHTML = `
            <a class="payment-link" href="${card.link}" target="_blank" rel="noopener noreferrer" aria-label="${card.name} aç">
              <article class="payment-card">
                <div class="card-inner">
                  <div class="thumb">
                    <img src="${imgUrl(card.seed)}" alt="${card.name}" loading="lazy" />
                  </div>
                  <div class="card-meta">
                    <div class="card-title">
                      <strong style="color: black;">${card.name}</strong>
                      <span style="color: black;">${card.tag}</span>
                    </div>
                    <div class="badge"><i class="${icon}"></i> Keçid</div>
                  </div>
                </div>
              </article>
            </a>
          `;

          cardWrapper.appendChild(col);
        });
      }

      function setActiveTab(active) {
        const isOnline = active === "online";
        onlineBtn.classList.toggle("active", isOnline);
        terminalBtn.classList.toggle("active", !isOnline);
        onlineBtn.setAttribute("aria-selected", String(isOnline));
        terminalBtn.setAttribute("aria-selected", String(!isOnline));
      }

      // İlk olaraq onlayn kartlar göstərilsin
      renderCards(onlineCards);

      onlineBtn.addEventListener("click", () => {
        setActiveTab("online");
        renderCards(onlineCards);
      });

      terminalBtn.addEventListener("click", () => {
        setActiveTab("terminal");
        renderCards(terminalCards);
      });
    </script>

    <script>
      const hamburger = document.getElementById("hamburger-menu");
      const menu = document.getElementById("menu");
      const closeMenu = document.getElementById("close-menu");
      const navbar = document.getElementById("navbar");

      const showHamburger = () => {
        hamburger.style.display = "flex";
        closeMenu.style.display = "none";
      };

      const showCloseMenu = () => {
        hamburger.style.display = "none";
        closeMenu.style.display = "block";
      };

      function isMobile() {
        return window.innerWidth <= 991;
      }

      hamburger.addEventListener("click", () => {
        menu.classList.add("active");
        showCloseMenu();
      });

      closeMenu.addEventListener("click", () => {
        menu.classList.remove("active");
        showHamburger();
      });

      window.addEventListener("resize", () => {
        if (!isMobile()) {
          menu.classList.remove("active");
          hamburger.style.display = "none";
          closeMenu.style.display = "none";
        } else {
          showHamburger();
        }
      });

      window.addEventListener("load", () => {
        if (isMobile()) showHamburger();
      });

      window.addEventListener("scroll", () => {
        if (window.scrollY > 10) navbar.classList.add("scrolled");
        else navbar.classList.remove("scrolled");
      });
    </script>
  </body>
</html>
