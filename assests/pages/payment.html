      <script>
        const cardWrapper = document.getElementById("cardWrapper");
        const onlineBtn = document.getElementById("onlineBtn");
        const terminalBtn = document.getElementById("terminalBtn");
      
        // 🔹 Öz şəkil linklərini BURADA yazırsan
        const onlineCards = [
          { name: "Fpay", tag: "Rəsmi ödəniş", image: "../images/fpay.svg", link: "https://fpay.az/guest/payments/new-payment/category/3/merchant/5021" },
          { name: "Hesab.az", tag: "Sürətli", image: "../images/hesabaz.png", link: "https://hesab.az/unregistered/#/direct-pay/internet/realtelecom/parameters" },
          { name: "EPUL", tag: "Populyar", image: "../images/epul.png", link: "https://example.com/epul" },
          { name: "Mpay", tag: "Mobil", image: "../images/mpay.svg", link: "https://mpay.svg" },
          { name: "Milliön", tag: "Geniş şəbəkə", image: "../images/million.jpeg", link: "https://www.million.az/services/internet/RealTelecomFizzaPay" },
          { name: "Birbank", tag: "Bank tətbiqi", image: "../images/1bank.svg", link: "https://example.com/birbank" }
        ];
      
        const terminalCards = [
          { name: "Emanat", tag: "Terminal", image: "../images/emenat.jpeg", link: "https://example.com/emanat" },
          { name: "Milliön", tag: "Terminal", image: "../images/million.jpeg", link: "https://example.com/million-terminal" },
          { name: "Kassam", tag: "Terminal", image: "../images/kassam.png", link: "https://example.com/kassam" },
          { name: "Expresspay", tag: "Terminal", image: "../images/expresspay.svg", link: "https://example.com/expresspay" }
        ];
      
        function badgeIcon(text) {
          const t = (text || "").toLowerCase();
          if (t.includes("terminal")) return "fa-solid fa-store";
          if (t.includes("mobil")) return "fa-solid fa-mobile-screen";
          if (t.includes("bank")) return "fa-solid fa-building-columns";
          if (t.includes("sürətli")) return "fa-solid fa-bolt";
          return "fa-solid fa-credit-card";
        }
      
        function renderCards(cards) {
          cardWrapper.innerHTML = "";
      
          cards.forEach((card) => {
            const col = document.createElement("div");
            col.className = "col";
      
            const icon = badgeIcon(card.tag);
      
            col.innerHTML = `
              <a class="payment-link" href="${card.link}" target="_blank" rel="noopener noreferrer">
                <article class="payment-card">
                  <div class="card-inner">
                    <div class="thumb">
                      <img src="${card.image}" alt="${card.name}" loading="lazy" />
                    </div>
                    <div class="card-meta">
                      <div class="card-title">
                        <strong style="color: black;">${card.name}</strong>
                        <span style="color: black;">${card.tag}</span>
                      </div>
                      <div class="badge"><i class="${icon}"></i> Keçid</div>
                    </div>
                  </div>
                </article>
              </a>
            `;
      
            cardWrapper.appendChild(col);
          });
        }
      
        function setActiveTab(active) {
          const isOnline = active === "online";
          onlineBtn.classList.toggle("active", isOnline);
          terminalBtn.classList.toggle("active", !isOnline);
        }
      
        // default
        renderCards(onlineCards);
      
        onlineBtn.addEventListener("click", () => {
          setActiveTab("online");
          renderCards(onlineCards);
        });
      
        terminalBtn.addEventListener("click", () => {
          setActiveTab("terminal");
          renderCards(terminalCards);
        });
      </script>

<script>
  const hamburger = document.getElementById("hamburger-menu");
  const menu = document.querySelector(".menu");
  const closeMenu = document.getElementById("close-menu");
  const navbar = document.querySelector(".navbar");

  const showHamburger = () => {
    hamburger.style.display = "flex";
    closeMenu.style.display = "none";
  };

  const showCloseMenu = () => {
    hamburger.style.display = "none";
    closeMenu.style.display = "block";
  };

  hamburger.addEventListener("click", function () {
    menu.classList.add("active");
    showCloseMenu();
  });

  closeMenu.addEventListener("click", function () {
    menu.classList.remove("active");
    showHamburger();
  });

  window.addEventListener("resize", function () {
    if (window.innerWidth > 991) {
      menu.classList.remove("active");
      hamburger.style.display = "none";
      closeMenu.style.display = "none";
    } else {
      showHamburger();
    }
  });

  window.addEventListener("load", function () {
    if (window.innerWidth <= 991) {
      showHamburger();
    }
  });

  window.addEventListener("scroll", function () {
    if (window.scrollY > 10) {
      navbar.classList.add("scrolled");
    } else {
      navbar.classList.remove("scrolled");
    }
  });
</script>
